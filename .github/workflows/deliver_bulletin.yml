name: NTUE Bulletin Delivery Guard

on:
  push:
    branches: [master]
    paths:
      - "scripts/send_scheduled_digest_guard.py"
      - "scripts/send_delivery_profiles.py"
      - "scripts/send_scheduled_digest_with_ai.py"
      - "scripts/send_email_brief_v2.py"
      - "scripts/send_scheduled_digest.py"
      - "frontend/public/data/settings.json"
      - "frontend/public/data/news.json"
      - "frontend/src/app/api/ai-report/scheduled/route.ts"
      - "frontend/src/middleware.ts"
      - ".github/workflows/deliver_bulletin.yml"
  # Exact UTC fallbacks for the three Asia/Taipei delivery slots.
  # Vercel durable scheduler remains the primary pre-wake path; these schedules
  # prevent a missed Vercel bootstrap/wake from leaving a bulletin overdue.
  schedule:
    - cron: "30 23 * * *" # 07:30 Asia/Taipei
    - cron: "30 6 * * *"  # 14:30 Asia/Taipei
    - cron: "30 13 * * *" # 21:30 Asia/Taipei
  workflow_dispatch:
  repository_dispatch:
    types: [vercel-scheduler-wake]

permissions:
  contents: write
  actions: read

concurrency:
  group: ntue-bulletin-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A scheduled run may wait behind a pre-warmed repository_dispatch run.
          # Always read the latest delivery state after the concurrency wait instead
          # of the event's older head SHA, otherwise the same slot can be sent twice.
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate email runtime
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import send_delivery_profiles; print('email runtime import OK')"

      - name: Check due or near-due delivery profiles
        id: guard
        shell: bash
        run: |
          if python scripts/send_scheduled_digest_guard.py --check; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deliver due or pre-warmed profiles
        if: steps.guard.outputs.needed == 'true'
        env:
          GITHUB_WORKFLOW_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: 國北教大輿情監測
          PUBLIC_BASE_URL: https://ntue-news-bulletin.vercel.app
        run: python scripts/send_scheduled_digest_guard.py

      - name: Persist delivery state
        if: always() && steps.guard.outputs.needed == 'true'
        run: |
          if git diff --quiet -- frontend/public/data/email-state.json; then
            echo "No delivery-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp frontend/public/data/email-state.json /tmp/email-state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/email-state.json frontend/public/data/email-state.json
            git add frontend/public/data/email-state.json
            if git diff --cached --quiet; then
              echo "Delivery state already persisted by another runner."
              exit 0
            fi
            git commit -m "state: persist profile delivery" || true
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "State push raced with another workflow; retrying ($attempt/5)."
            sleep 2
          done
          echo "Failed to persist delivery state after retries."
          exit 1
