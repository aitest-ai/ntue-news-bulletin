name: NTUE Bulletin Delivery Guard

on:
  schedule:
    # GitHub cron uses UTC. These are redundant pre-warm and fallback triggers
    # around 08:00 Asia/Taipei (UTC+8), intentionally avoiding dependence on
    # a single top-of-hour cron invocation.
    - cron: "45,50,55 23 * * *"
    - cron: "0,5,10 0 * * *"
    # Lightweight all-day fallback. If GitHub skips the exact window, the
    # same-day catch-up logic still delivers on the next run.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ntue-bulletin-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deliver due or pre-warmed bulletin
        env:
          GITHUB_WORKFLOW_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: 國北教大輿情監測
          PUBLIC_BASE_URL: https://ntue-news-bulletin.vercel.app
        run: |
          python -m pip install --quiet reportlab playwright
          python scripts/send_scheduled_digest_guard.py

      - name: Persist delivery state
        run: |
          if git diff --quiet -- frontend/public/data/email-state.json; then
            echo "No delivery-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp frontend/public/data/email-state.json /tmp/email-state.json
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/email-state.json frontend/public/data/email-state.json
            git add frontend/public/data/email-state.json
            if git diff --cached --quiet; then
              echo "Delivery state already persisted by another runner."
              exit 0
            fi
            git commit -m "state: persist bulletin delivery" || true
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "State push raced with another workflow; retrying ($attempt/3)."
            sleep 2
          done
          echo "Failed to persist delivery state after retries."
          exit 1
