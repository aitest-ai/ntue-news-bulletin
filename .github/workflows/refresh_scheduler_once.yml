name: Refresh Durable Scheduler Once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/refresh_scheduler_once.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh today's durable wake timers
        run: |
          curl --fail-with-body --silent --show-error \
            -A 'vercel-cron/1.0' \
            'https://ntue-news-bulletin.vercel.app/api/scheduler/bootstrap'
