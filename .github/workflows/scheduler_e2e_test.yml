name: Durable Scheduler E2E Test

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/scheduler_e2e_test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Start today's durable wakes through production bootstrap
        run: |
          curl --fail-with-body --silent --show-error \
            -A 'vercel-cron/1.0' \
            'https://ntue-news-bulletin.vercel.app/api/scheduler/bootstrap'
