name: Frontend Build Check

on:
  push:
    branches: [master]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.js"
      - "frontend/tsconfig.json"
      - "frontend/vercel.json"
      - "frontend/src/app/api/scheduler/**"
      - "frontend/src/workflows/**"
      - "frontend/src/middleware.ts"
      - ".github/workflows/frontend_build_check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          ADMIN_PASSWORD: build-check-placeholder
          GEMINI_API_KEY: build-check-placeholder
          GITHUB_PAT: build-check-placeholder
        run: npm run build
