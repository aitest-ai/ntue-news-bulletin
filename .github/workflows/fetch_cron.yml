name: NTUE Opinion Collector

on:
  push:
    branches: [master]
    paths:
      - "scripts/collect_static.py"
      - ".github/workflows/fetch_cron.yml"
  schedule:
    # Taiwan 07:30-10:00 (UTC previous day 23:30 through 02:00)
    - cron: "30 23 * * *"
    - cron: "0,30 0-1 * * *"
    - cron: "0 2 * * *"
    # Taiwan 16:00-18:00 (UTC 08:00-10:00)
    - cron: "0,30 8-9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntue-opinion-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public opinion data
        run: python scripts/collect_static.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- frontend/public/data/news.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/news.json
          git commit -m "data: refresh NTUE opinion feed"
          git push origin HEAD:master
