name: NTUE Opinion Collector

on:
  push:
    branches: [master]
    paths:
      - "scripts/collect_static.py"
      - "scripts/collect_threads_public_search.py"
      - "scripts/collect_threads_deep.py"
      - "scripts/collect_threads_deep_v2.py"
      - "scripts/refine_threads_quality.py"
      - "scripts/refine_news_quality.py"
      - "scripts/resolve_source_urls.py"
      - "scripts/filter_relevance.py"
      - ".github/workflows/fetch_cron.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntue-opinion-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public opinion data
        run: python scripts/collect_static.py

      - name: Search indexed public Threads posts
        continue-on-error: true
        run: python scripts/collect_threads_public_search.py

      - name: Deep search public Threads discussions
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright
          timeout 210s python scripts/collect_threads_deep_v2.py

      - name: Enforce exact Threads dates and readable topics
        run: python scripts/refine_threads_quality.py

      - name: Verify original news dates and exclude school-only mentions
        run: python scripts/refine_news_quality.py

      - name: Resolve recent source URLs
        run: |
          python -m pip install --quiet googlenewsdecoder==0.1.7
          python scripts/resolve_source_urls.py

      - name: Remove unrelated general news
        run: python scripts/filter_relevance.py

      # Collection never writes email-state.json. Delivery state belongs only
      # to NTUE Bulletin Delivery Guard, preventing stale state overwrites and
      # duplicate/missed sends when collector and mail jobs overlap.
      - name: Commit refreshed opinion data
        run: |
          if git diff --quiet -- frontend/public/data/news.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp frontend/public/data/news.json /tmp/news.json
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/news.json frontend/public/data/news.json
            git add frontend/public/data/news.json
            if git diff --cached --quiet; then
              echo "Opinion data already current."
              exit 0
            fi
            git commit -m "data: refresh NTUE opinion feed" || true
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Data push raced with another workflow; retrying ($attempt/5)."
            sleep 2
          done
          echo "Failed to persist refreshed opinion data after retries."
          exit 1
