name: NTUE Opinion Collector

on:
  push:
    branches: [master]
    paths:
      - "scripts/collect_static.py"
      - "scripts/collect_threads_public_search.py"
      - "scripts/collect_threads_deep.py"
      - "scripts/collect_threads_deep_v2.py"
      - "scripts/filter_relevance.py"
      - "scripts/send_scheduled_digest.py"
      - "scripts/send_scheduled_digest_with_ai.py"
      - "scripts/send_scheduled_digest_reliable.py"
      - "scripts/send_delivery_profiles.py"
      - "frontend/src/app/api/ai-report/scheduled/route.ts"
      - "frontend/src/middleware.ts"
      - "frontend/public/data/settings.json"
      - ".github/workflows/fetch_cron.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ntue-opinion-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public opinion data
        run: python scripts/collect_static.py

      - name: Search indexed public Threads posts
        continue-on-error: true
        run: python scripts/collect_threads_public_search.py

      - name: Deep search public Threads discussions
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright
          timeout 210s python scripts/collect_threads_deep_v2.py

      - name: Remove unrelated general news
        run: python scripts/filter_relevance.py

      # Format lock: scheduled email may only send the browser-rendered live
      # /reports PDF. The legacy ReportLab fallback must never be delivered.
      - name: Send all due delivery profiles
        env:
          GITHUB_WORKFLOW_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: 國北教大輿情監測
          PUBLIC_BASE_URL: https://ntue-news-bulletin.vercel.app
        run: |
          if python scripts/send_delivery_profiles.py --is-due; then
            echo "One or more delivery profiles are due; rendering live /reports PDFs and sending through Brevo."
            python -m pip install --quiet reportlab playwright
            python scripts/send_delivery_profiles.py
          else
            echo "No delivery profile due."
          fi

      - name: Commit refreshed data and delivery state
        run: |
          if git diff --quiet -- frontend/public/data/news.json frontend/public/data/email-state.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp frontend/public/data/news.json /tmp/news.json
          cp frontend/public/data/email-state.json /tmp/email-state.json
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/news.json frontend/public/data/news.json
          cp /tmp/email-state.json frontend/public/data/email-state.json
          git add frontend/public/data/news.json frontend/public/data/email-state.json
          git commit -m "data: refresh NTUE opinion feed"
          git push origin HEAD:master
