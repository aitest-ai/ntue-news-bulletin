name: NTUE Opinion Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-fetch]

concurrency:
  group: ntue-opinion-scheduler
  cancel-in-progress: false

jobs:
  trigger_vercel_collector:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger scheduled collection on Vercel
        run: |
          set -e
          curl --fail-with-body \
            --retry 2 \
            --retry-delay 3 \
            --max-time 90 \
            -X POST \
            -H "User-Agent: NTUE-Opinion-Scheduler/2.0" \
            https://ntue-news-bulletin.vercel.app/api/internal/scheduled-fetch
