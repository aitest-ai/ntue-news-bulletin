name: NTUE Opinion Collector

on:
  push:
    branches: [master]
    paths:
      - "scripts/collect_static.py"
      - "scripts/collect_threads_public_search.py"
      - "scripts/collect_threads_browser.py"
      - "scripts/send_scheduled_digest.py"
      - "frontend/public/data/settings.json"
      - "frontend/public/data/email-state.json"
      - ".github/workflows/fetch_cron.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntue-opinion-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public opinion data
        run: python scripts/collect_static.py

      - name: Search indexed public Threads posts
        run: python scripts/collect_threads_public_search.py

      - name: Generate AI PDF report and send scheduled bulletin when due
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_BASE_URL: https://ntue-news-bulletin.vercel.app
        run: |
          if python scripts/send_scheduled_digest.py --is-due; then
            echo "Bulletin is due; preparing PDF report."
            python -m pip install --quiet reportlab
            python scripts/send_scheduled_digest.py
          else
            echo "No scheduled bulletin due."
          fi

      - name: Search public Threads posts with browser
        continue-on-error: true
        run: timeout 55s python scripts/collect_threads_browser.py

      - name: Commit refreshed data and delivery state
        run: |
          if git diff --quiet -- frontend/public/data/news.json frontend/public/data/email-state.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/news.json frontend/public/data/email-state.json
          git commit -m "data: refresh NTUE opinion feed"
          git pull --rebase origin master
          git push origin HEAD:master
