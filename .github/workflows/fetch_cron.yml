name: NTUE Opinion Scheduler

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-fetch]

concurrency:
  group: ntue-opinion-scheduler
  cancel-in-progress: false

jobs:
  trigger_vercel_collector:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose Vercel API and scheduler
        run: |
          set +e
          echo '=== API import check: GET /api/auth/login (expected 405 if healthy) ==='
          curl -sS -i --max-time 20 https://ntue-news-bulletin.vercel.app/api/auth/login | head -40
          echo
          echo '=== Scheduler endpoint ==='
          curl -sS -i --max-time 60 -X POST -H "User-Agent: NTUE-Opinion-Scheduler/2.0" https://ntue-news-bulletin.vercel.app/api/internal/scheduled-fetch | head -80
          exit 0
