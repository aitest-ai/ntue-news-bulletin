version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntue-bulletin-backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./ntue_bulletin.db
      - ADMIN_PASSWORD=ntue1234
      - JWT_SECRET=jwt_secret_key_ntue_bulletin_2026
      - IS_DOCKER=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ntue-bulletin-frontend
    restart: always
    ports:
      - "3002:3002"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
