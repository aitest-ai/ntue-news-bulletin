services:
  - type: web
    name: ntue-news-bulletin-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ntue-bulletin-db
          property: connectionString
      - key: ADMIN_PASSWORD
        value: ntue1234
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ntue-bulletin-db
    plan: free
